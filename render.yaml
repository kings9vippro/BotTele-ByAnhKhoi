services:
  - type: web
    name: bot-treo-4app-vn
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --config gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_KEY
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: ZALO_PREFER_COUNTRY
        value: SG
